services:
  db:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bio_store_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: DB_URL
      POSTGRES_USER: DB_USER
      POSTGRES_PASSWORD: DB_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biostore_user -d biostore_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: